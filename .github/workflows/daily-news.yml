name: CSO 데일리 브리핑 자동 생성

on:
  schedule:
    # 매일 오전 7시 KST (UTC 22:00 전날)
    - cron: '0 22 * * *'
  workflow_dispatch:   # 수동 실행 버튼

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install anthropic feedparser

      - name: 뉴스 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_news.py

      - name: 회사별 마지막 기사 아카이브 커밋
        run: |
          git config user.name "cso-daily-bot"
          git config user.email "actions@github.com"
          git add company_archive.json
          git diff --cached --quiet || git commit -m "chore: 회사별 기사 아카이브 갱신 [skip ci]"
          git push || true

      - name: GitHub Pages 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
